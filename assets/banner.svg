<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#090A10" stop-opacity="1"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="claudeText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="50%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#E57373"/>
    </linearGradient>

    <linearGradient id="gravityText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Subtle Accent Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0"/>
      <stop offset="30%" stop-color="#D97757" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="240" fill="#090A10" rx="16"/>
  <rect width="1000" height="240" fill="url(#bgGlow)" rx="16"/>
  <rect x="1" y="1" width="998" height="238" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Center Typography Container -->
  <g transform="translate(500, 115)" text-anchor="middle">
    <!-- Main Title -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="76" letter-spacing="-2" filter="url(#softGlow)">
      <tspan fill="url(#claudeText)">Claude</tspan><tspan fill="url(#gravityText)">Gravity</tspan>
    </text>

    <!-- Subtitle -->
    <text y="46" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="16" fill="#94A3B8" letter-spacing="3" opacity="0.9">
      CLAUDE DESKTOP  ×  GOOGLE ANTIGRAVITY
    </text>

    <!-- Elegant Underline Divider -->
    <rect x="-180" y="66" width="360" height="2" rx="1" fill="url(#lineGrad)"/>
  </g>
</svg>
